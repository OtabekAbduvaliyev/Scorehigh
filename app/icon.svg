<svg xmlns="http://www.w3.org/2000/svg" viewBox="100 90 300 300" width="100%" height="100%">
  <defs>
    <style>
      .primary-purple { fill: #5522C2; }
      .light-purple { fill: #9D84F3; }
      .white-stroke { stroke: #FFFFFF; stroke-width: 14; stroke-linejoin: round; stroke-linecap: round; }
    </style>
  </defs>

  <!-- 1. GRADUATION CAP / MORTARBOARD -->
  <path 
